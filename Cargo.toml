[workspace]
resolver = "2"
members = ["csc", "easysign", "ipc", "agent", "pkcs11"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
base64 = "0.22"
sha2 = "0.10"
thiserror = "1"
anyhow = "1"
rpassword = "7"
